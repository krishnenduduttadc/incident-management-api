[project]
name = "incident-management-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krishnendu", email = "krishnenduduttadc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.2.0",
    "marshmallow>=4.4.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
]

[project.scripts]
incident-management-api = "incident_management_api:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
